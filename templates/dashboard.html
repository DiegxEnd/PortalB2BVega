<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal B2B · {{ proveedor_nombre }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="boot" id="boot">
  <div class="boot-in">
    <div class="logo">GV</div>
    <b style="color:var(--ink)">{{ proveedor_nombre }}</b>
    <div id="bootMsg">Preparando tu portal…</div>
    <div class="boot-bar"><i></i></div>
  </div>
</div>
<div class="topload" id="topload"></div>

<div id="app">
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="logo">GV</div>
      <div><b>{{ proveedor_nombre }}</b><small>Portal B2B · Grupo Vega</small></div>
    </div>
    <div class="sb-label">Análisis</div>
    <nav id="navLinks"></nav>
    <div class="sb-foot">
      <div class="sb-user">
        <div class="avatar">{{ proveedor_nombre[:2] | upper }}</div>
        <div style="min-width:0"><b>{{ usuario }}</b><small>Proveedor</small></div>
      </div>
      <a class="navlink" href="{{ url_for('logout') }}" style="margin:.2rem 0 0"><i data-lucide="log-out"></i> Cerrar sesión</a>
    </div>
  </aside>
  <div class="backdrop" onclick="toggleNav(false)"></div>

  <div class="main">
    <header class="topbar">
      <button class="btn btn-ghost btn-sm menu-btn" onclick="toggleNav(true)" aria-label="Menú"><i data-lucide="menu"></i></button>
      <div>
        <div class="crumb" id="crumb">Portal B2B</div>
        <h1 id="pageTitle">Resumen</h1>
      </div>
      <div class="grow"></div>
      <span class="pill hide-m" id="syncPill"><span class="dot gris"></span>Sincronizando…</span>
      <span class="pill hide-m" id="rangePill"><i data-lucide="database"></i>—</span>
    </header>

    <div class="filterbar" id="filterbar"></div>

    <div class="content"><div id="view"></div></div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
